    .tile:nth-child(1){animation-delay:.08s}.tile:nth-child(2){animation-delay:.16s}.tile:nth-child(3){animation-delay:.24s}

    .icon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 8px 22px rgba(0,0,0,.16)}

    .label{font-size:16px;font-weight:800;line-height:1.2}.store .label{font-size:18px}
    .hint{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
    .store-copy{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
    .arrow{margin-inline-start:auto;font-size:26px;color:var(--cyan);transform:rotate(180deg);opacity:.92}
    footer{margin-top:auto;padding-top:26px;text-align:center}
    .made{font-size:12px;color:rgba(220,240,250,.63);text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:8px 11px;border-radius:999px}

    @keyframes reveal{to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1;transform:none}}
